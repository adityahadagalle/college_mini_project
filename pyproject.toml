[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-analysis-system"
version = "1.0.0"
description = "Production-Grade AI-Powered Sentiment Analysis Platform using TensorFlow 2.x and FastAPI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tensorflow>=2.14.0",
    "tf-keras>=2.14.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.23",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib>=1.7.4",
    "psutil>=5.9.6",
]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
mypy_path = "backend"
explicit_package_bases = true
strict = true
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "app.*"
follow_imports = "normal"
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "."]
asyncio_mode = "auto"
